name: CI

on:
  push:
    branches: [main]
  # `labeled` is NOT one of the default pull_request activity types (opened, synchronize,
  # reopened), so without this list, adding the `full-eval` label to an open pull request
  # fires an event the workflow ignores, and re-running the last run replays the original
  # payload — which had no label on it. That is why a labelled pull request kept skipping
  # the gated jobs. Listing the types means listing all of them: naming only `labeled`
  # would stop CI running on pushes.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# TODO: pin every third-party action below to a commit SHA. Tag refs are used for now
# because writing an unverified digest would be a guess.
jobs:
  # Lint and unit tests. No secrets, no network beyond installing packages.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -m "not integration" --cov

      # Both of the steps below are offline, deterministic and secret-free, which is why
      # they belong here and not in the `eval` job. The unit-test step above already runs
      # them; they are repeated as named steps so a failure says which guard broke rather
      # than "some test failed".

      # Static half of the gold-leakage guard: parses every pipeline module and fails on any
      # reference to the answer key, including in code no test executes. The runtime half is
      # the audit hook in tests/ri05/test_tender_loader.py.
      - name: Gold-leakage scan
        run: uv run pytest tests/ri05/test_no_gold_leakage.py -q

      # The floor an UNSTATED- or DISPLACED-recovery claim has to clear, recomputed from
      # the committed tender and compared against the committed record. Fails if a measured
      # figure moved, which means the extraction or the gold set changed under it. The date
      # is ignored. This step is what caught the gold set's own IMPLICIT labelling.
      - name: Keyword baseline is current
        run: uv run python -m ri05_tender.eval.baseline data/tenders/kessler_point --check

  # Integration tests and the evaluation run. Needs secrets, so it is skipped (not failed)
  # whenever they are absent — pull requests from forks, and forks' own pipelines.
  eval:
    name: eval
    runs-on: ubuntu-latest
    # Measured, not guessed. A labelled run makes 42 live calls: extraction's own 14-call
    # pass, plus the detection pass, which extracts the corpus again before reading claims
    # over it (14 + 14). At the ~40s a call the ledger records for a full page, that is
    # around 30 minutes of wall clock, and 30 was where the limit stood — so the job was
    # cancelled mid-pass on main at 2d43914 and on this branch, both times throwing away
    # calls already paid for. 60 leaves room for a slow page without inviting a hung job to
    # sit for an hour. An unlabelled pull request still finishes in about a minute.
    #
    # The duplication is real and is NOT fixed here: the detection pass re-extracts what the
    # extraction pass just extracted, so a full run pays roughly $0.89 twice. Sharing one
    # extraction between the two is a design change, and raising a timeout that was measured
    # wrong should not smuggle one in.
    timeout-minutes: 60
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
    steps:
      # The `secrets` context is not available in an `if:` expression, so the guard has to
      # be a step that reads the secret and publishes a plain output.
      - name: Check whether secrets are available
        id: guard
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is empty; skipping the evaluation job."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Install uv
        if: steps.guard.outputs.available == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        if: steps.guard.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.available == 'true'
        run: uv sync --all-packages --locked

      # RI05_FULL_EVAL gates the 301-clause extraction pass, on the same expression that
      # chooses the full gold set below: a push to main, or a pull request labelled
      # `full-eval`. Without it the extraction smoke test still runs — one page, one call —
      # so every pull request proves the wire is connected without paying for a measurement
      # nobody asked for. `-s` because the pass prints its ledger, and a measurement that
      # only exists in a downloadable artifact is one nobody reads.
      - name: Integration tests
        if: steps.guard.outputs.available == 'true'
        env:
          RI05_FULL_EVAL: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-eval') }}
        run: uv run pytest -m integration -s

      # The full gold set runs on pushes to main and on pull requests labelled `full-eval`;
      # every other pull request gets a 20-item sample.
      - name: Determine evaluation scope
        id: scope
        if: steps.guard.outputs.available == 'true'
        env:
          FULL_EVAL: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-eval') }}
        run: |
          if [ "$FULL_EVAL" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::Running the full gold set."
          else
            echo "args=--sample 20" >> "$GITHUB_OUTPUT"
            echo "::notice::Running a 20-item sample."
          fi

      - name: Run evaluation
        if: steps.guard.outputs.available == 'true'
        env:
          EVAL_ARGS: ${{ steps.scope.outputs.args }}
        # EVAL_ARGS is deliberately unquoted: it is either empty or two separate arguments.
        # The real spine.eval.run must honour --json-out and --project when it is
        # implemented: the gate below reads the path named by --json-out, and --project
        # labels the report. Today's stub already accepts both.
        run: |
          uv run python -m spine.eval.run $EVAL_ARGS \
            --out eval_report.md \
            --json-out eval_report.json \
            --project example

      # Posted before the gate runs, so a regression still leaves the report on the PR.
      - name: Post the report as a sticky pull-request comment
        if: steps.guard.outputs.available == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eval-report
          path: eval_report.md

      - name: Check for regressions against the baseline
        if: steps.guard.outputs.available == 'true'
        run: uv run python -m spine.eval.gate --report eval_report.json --baseline evals/baseline.json

      - name: Upload the report
        if: "!cancelled() && steps.guard.outputs.available == 'true'"
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report.md
            eval_report.json
          if-no-files-found: ignore

      # The ledger snapshots the integration tests persist the moment a pass returns. Always
      # uploaded, including when the job failed: the calls were paid for either way, and the
      # run that prompted this step threw its measurement away on an assertion.
      - name: Upload live-run ledgers
        if: always() && steps.guard.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-run-ledgers
          path: .artifacts/
          # `.artifacts` is a dot directory, and the action skips hidden files by default.
          # Without this the snapshots were written, printed, and then silently dropped at
          # upload time — the first full pass logged "No files were found".
          include-hidden-files: true
          if-no-files-found: ignore
