# RI-05, the tender response engine.
#
# EVERY TARGET IS UNSET. Not zero, not a placeholder — `target: null`, which
# `spine.kpi.KPISpec` reads as "this project reports the metric and has not yet decided what
# good looks like". `compute_kpis` refuses to measure a metric with no target rather than
# inventing one, so this config declares the instrument without pretending to a standard.
#
# A target here would be a number somebody made up. The pipeline does not exist yet, and the
# keyword baseline in evals/results/kessler_point_keyword_baseline.json is the only measured
# figure on this project. That baseline is also why the IMPLICIT class no longer exists: it
# recovered 20 of the 72 items labelled implicit, against a written claim that it would
# recover none, because 40 of them were plain "shall" clauses displaced into annexes and
# drawing notes. The class is now UNSTATED (32) and DISPLACED (40), measured separately —
# see gold/CORRECTION_implicit_class.md beside the tender.
project: ri05
description: >-
  Tender response engine: read a tender package, find the defects a presale engineer would
  have to find by hand, and produce the artefacts each one demands. Scored by
  ri05_tender.eval against a labelled tender's answer key.
gold_set: example

kpis:
  project: ri05

  # No cassette-served run has been scored on this project, and none should be counted if
  # one is: a demo's cost is not this project's cost.
  include_replayed_cost: false

  # The two figures the project stands or falls on. Recall of the defects a human would
  # have caught, and the money it took to get them.
  headline:
    - recall_overall
    - cost_per_run

  kpis:
    - name: recall_overall
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: test
      computation: accuracy
      tolerance: 0.02
      description: >-
        Share of scored gold items fully matched. Only MATCH counts: a finding that saw the
        defect but did not produce the output it demanded is not a find.

    - name: recall_weighted
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: test
      computation: mean_score
      tolerance: 0.02
      description: >-
        Recall with each item counted by what missing it would cost — no_bid 8, critical 4,
        major 2, minor 1. Reported beside the unweighted figure because the same hit rate
        means different things depending on which items were missed.

    - name: recall_cold_start
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: test
      computation: precision
      positive_label: "yes"
      tolerance: 0.02
      description: >-
        Recall over the cold_start tier: what the system finds with no configuration, no
        company facts and no catalogue. The number a first run on a new tender would give.

    # The four metrics that replaced implicit_recovery and implicit_uplift. Two classes, two
    # recoveries, two uplifts, and no figure anywhere that adds them: an average over both is
    # an average of two different capabilities, and it moves when the mix changes rather than
    # when the system does.
    - name: unstated_recovery
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: test
      computation: recall
      positive_label: "yes"
      tolerance: 0.02
      description: >-
        Recall over the 32 UNSTATED items — obligations written nowhere in the package, in
        either of two shapes: a priced line item implying scope (29), or a declarative scope
        or applicability statement whose duty is left to the reader (3). Nothing to retrieve;
        the obligation has to be constructed, which is why both shapes score the same way. Do
        not publish without unstated_uplift beside it.

    - name: displaced_recovery
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: test
      computation: recall
      positive_label: "yes"
      tolerance: 0.02
      description: >-
        Recall over the 40 DISPLACED items — obligations written out plainly as "shall"
        clauses, but in a drawing note, an annex or a federal-provisions clause where a
        requirements review never goes. Readable, which is the point: this is the half a
        keyword rule has any claim on, so it is where an uplift figure has to be earned. Do
        not publish without displaced_uplift beside it.

    - name: unstated_uplift
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: analysis
      computation: mean_score
      tolerance: 0.02
      description: >-
        unstated_recovery above the keyword baseline, which measures 0.0 on this class and is
        0.0 structurally: a rule that searches sentences cannot produce a candidate for an
        obligation that has no sentence. A floor of zero makes this uplift equal to the
        recovery itself, and it is still reported separately so that stays visible rather
        than assumed.

    - name: displaced_uplift
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: analysis
      computation: mean_score
      tolerance: 0.02
      description: >-
        displaced_recovery above the keyword baseline, measured in CI on the same documents
        through the same extraction and the same matcher. The floor is 0.0, and unlike the
        UNSTATED floor it is 0.0 on the merits: the keyword rule reaches 37 of these 40 items
        on anchor and type, and fails only the requirement to state the obligation in its own
        words rather than quote it. This is the number that means something.

    - name: precision_strict
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: test
      computation: precision
      positive_label: "yes"
      tolerance: 0.05
      description: >-
        Matches over matches plus unmatched plus duplicate findings. Never reported without
        precision_adjudicated: quoting either alone is a choice about how flattering the
        number is.

    - name: precision_adjudicated
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: inspection
      computation: precision
      positive_label: "yes"
      tolerance: 0.05
      description: >-
        Matches plus human-confirmed new findings, over all findings. Requires a human to
        have ruled on the adjudication queue, which is why its method is inspection.

    - name: no_bid_gate
      unit: ratio
      target: null # UNSET
      direction: higher_is_better
      method: test
      computation: accuracy
      tolerance: 0.0
      description: >-
        1.0 only when every scored no_bid item was fully matched, 0.0 otherwise. Not a rate
        and must never be read as one: a bid going out on a tender the system should have
        refused is not offset by anything else. A target here would be 1.0 and nothing else,
        which is exactly why it is not written down until the pipeline can be held to it.

    - name: cost_per_run
      unit: usd
      target: null # UNSET
      direction: lower_is_better
      method: analysis
      computation: total_cost_usd
      tolerance: 0.5
      description: >-
        Model spend for one pass over one tender package. Refuses to produce a figure at all
        when the run was served from a cassette — see spine.kpi.cost_basis.

    - name: time_to_first_finding
      unit: seconds
      target: null # UNSET
      direction: lower_is_better
      method: demonstration
      computation: mean_latency_ms
      tolerance: 5.0
      description: >-
        How long a presale engineer waits before the first defect appears. Method is
        demonstration because it is a property of the experience, not of the answer, and it
        is judged by watching a run rather than by reading a log. NOTE: computed today from
        mean model-call latency, which is a proxy — the real measurement needs the pipeline
        to emit findings as it goes, which it cannot yet do.

  # No ROI block. Every rate, volume and hour count would have to be stated here, and none
  # of them has been measured for this project. An ROI assembled from invented inputs is a
  # sales slide; see spine.kpi.ROIInputs, which will not build without an assumptions_source.
