[project]
name = "req-core"
version = "0.1.0"
description = "Domain-agnostic requirement extraction: unstructured text in, typed requirement structures out."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/req_core"]
