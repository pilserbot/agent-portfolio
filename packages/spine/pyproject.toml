[project]
name = "spine"
version = "0.1.0"
description = "Shared evaluation, model routing and KPI library for the agent portfolio."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "instructor>=1.7",
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "litellm>=1.60",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]
