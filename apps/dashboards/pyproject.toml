[project]
name = "dashboards"
version = "0.1.0"
description = "Streamlit dashboards over the portfolio's evaluation and KPI data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spine",
    "pydantic>=2.9",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboards"]

[tool.uv.sources]
spine = { workspace = true }
