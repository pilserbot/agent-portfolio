[project]
name = "ri05-tender"
version = "0.1.0"
description = "RI05 tender response engine (FastAPI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spine",
    "req-core",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ri05_tender"]

[tool.uv.sources]
spine = { workspace = true }
req-core = { workspace = true }
