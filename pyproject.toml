[project]
name = "agent-portfolio"
version = "0.1.0"
description = "AI agent portfolio monorepo: shared evaluation spine, requirement extraction core, and the applications built on them."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spine",
    "req-core",
    "ri05-tender",
    "dashboards",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# The repository root is a virtual workspace root: it pins the toolchain and the
# shared configuration, but is never built or published itself.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
spine = { workspace = true }
req-core = { workspace = true }
ri05-tender = { workspace = true }
dashboards = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/spine/src",
    "packages/req_core/src",
    "apps/ri05_tender/src",
    "apps/dashboards/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations: full type hints are a project convention
    "D",    # pydocstyle: every module carries a docstring
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on the first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; docstrings are not required.
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Importable without an install step, so a bare `pytest` behaves like `make test`.
pythonpath = [
    "packages/spine/src",
    "packages/req_core/src",
    "apps/ri05_tender/src",
    "apps/dashboards/src",
]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs an API key, a database or the network; excluded from `make test-fast`",
]

[tool.coverage.run]
branch = true
source = ["spine", "req_core", "ri05_tender", "dashboards"]

[tool.coverage.report]
show_missing = true
